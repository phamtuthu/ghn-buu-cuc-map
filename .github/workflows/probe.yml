name: Dò schema API (tạm)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dò schema
        env:
          GHN_DATA_TOKEN: ${{ secrets.GHN_DATA_TOKEN }}
        run: python probe.py
